name: Release
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['install.sh']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Test
        run: go test ./...
      - name: Build Linux archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          for arch in amd64 arm64; do
            mkdir -p "out/chatgpt-remote-linux-$arch/bin"
            cp -r scripts README.md LICENSE docs "out/chatgpt-remote-linux-$arch/"
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o "out/chatgpt-remote-linux-$arch/bin/chatgpt-remote" ./cmd/remote
            tar -czf "out/chatgpt-remote-linux-$arch.tar.gz" -C out "chatgpt-remote-linux-$arch"
            rm -rf "out/chatgpt-remote-linux-$arch"
          done
          cd out
          sha256sum *.tar.gz > SHA256SUMS
      - name: Publish first installable release (or version tag)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.2.0' }}
          target_commitish: ${{ github.sha }}
          files: |
            out/*.tar.gz
            out/SHA256SUMS
